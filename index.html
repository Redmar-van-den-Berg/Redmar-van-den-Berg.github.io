<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>JBrowse Linear Genome View</title>

    <script
      src="react-linear-genome-view.umd.production.min.js"
    ></script>
  </head>

  <body>
    <div id="jbrowse_linear_genome_view"></div>

    <script>
      const { React, createRoot, createViewState, JBrowseLinearGenomeView } =
        JBrowseReactLinearGenomeView

      const state = new createViewState({
        assembly: {
          name: 'hg38',
          sequence: {
            type: 'ReferenceSequenceTrack',
            trackId: 'GRCh38-ReferenceSequenceTrack',
            adapter: {
              type: 'BgzipFastaAdapter',
              uri: 'https://jbrowse.org/genomes/GRCh38/fasta/hg38.prefix.fa.gz',
            },
          },
          refNameAliases: {
            adapter: {
              type: 'RefNameAliasAdapter',
              uri: 'https://jbrowse.org/genomes/GRCh38/hg38_aliases.txt',
            },
          },
          cytobands: {
            adapter: {
              type: 'CytobandAdapter',
              uri: 'https://jbrowse.org/genomes/GRCh38/cytoBand.txt',
            },
          },
        },
        tracks: [
          {
            type: 'FeatureTrack',
            trackId: 'GCA_DMD_minimal',
            name: 'jbrowse GCA file grep DMD minimal',
            assemblyNames: ['hg38'],
            adapter: {
              type: 'Gff3Adapter',
              uri: 'DMD/GCA_DMD_min.gff'
            }
          },
          {
            type: 'FeatureTrack',
            trackId: 'DMD_bed',
            name: 'Wildtype',
            assemblyNames: ['hg38'],
            adapter: {
              type: 'BedAdapter',
              uri: 'DMD/DMD.wt.bed'
            },
            displays: [
              {
              type: 'LinearBasicDisplay',
              height: 350
              }
            ]
          },{
            type: 'FeatureTrack',
            trackId: 'DMD_del_bed',
            name: 'DMD 2500del',
            assemblyNames: ['hg38'],
            adapter: {
              type: 'BedAdapter',
              uri: 'DMD/DMD.del.bed'
            },
            displays: [
              {
              type: 'LinearBasicDisplay',
              height: 350
              }
            ]
          },{
            type: 'FeatureTrack',
            trackId: 'DMD_del2500_skip19_20',
            name: 'Skip exons 19 and 20',
            assemblyNames: ['hg38'],
            adapter: {
              type: 'BedAdapter',
              uri: 'DMD/DMD.skip19_20.bed'
            },
            displays: [
              {
              type: 'LinearBasicDisplay',
              height: 350
              }
            ]
          },{
            type: 'FeatureTrack',
            trackId: 'DMD_del2500_skip20_21',
            name: 'Skip exons 20 and 21',
            assemblyNames: ['hg38'],
            adapter: {
              type: 'BedAdapter',
              uri: 'DMD/DMD.skip20_21.bed'
            },
            displays: [
              {
              type: 'LinearBasicDisplay',
              height: 350
              }
            ]
          },
          {
            type: 'FeatureTrack',
            trackId: 'ClinVar',
            name: 'ClinVar',
            assemblyNames: ['hg38'],
            adapter: {
              type: 'VcfTabixAdapter',
              vcfGzLocation: {
                uri:"https://ftp.ncbi.nlm.nih.gov/pub/clinvar/vcf_GRCh38/clinvar.vcf.gz",
                locationType: "UriLocation"
              },
              index: {
                location: {
                  uri: "https://ftp.ncbi.nlm.nih.gov/pub/clinvar/vcf_GRCh38/clinvar.vcf.gz.tbi",
                  locationType: "UriLocation"
                }
              }
            }
          },
          {
            type: "FeatureTrack",
            name: "Custom encoded track",
            trackId: "localtrack",
            assemblyNames: ["hg38"],
            category: ["Annotation"],
            adapter: {
              type: "FromConfigAdapter",
              features: [
                {
                  refName: "X",
                  name: "Field 1",
                  uniqueId: 4,
                  start: 31178799,
                  end: 31182790,
                  fill: "#D9ADFF"
                }
              ]
            },
            displays: [
              {
                type: "LinearBasicDisplay",
                displayId: "nextstrain-color-display",
                renderer: {
                  type: "SvgFeatureRenderer",
                  color1: "jexl:get(feature,'fill') || 'black'"
                }
              }
            ]
          }
        ],

        defaultSession: {
          name: 'My session',
          view: {
            id: 'linearGenomeView',
            type: 'LinearGenomeView',
            displayedRegions: [
              {
                refName: 'X',
                start:31119221,
                end:31121930,
                reversed:true,
                assemblyName: 'hg38',
              }
            ]
          },
        },
      })
      state.session.view.setShowGridlines(false)
      const visible_tracks = ['localtrack', 'DMD_bed', 'DMD_del_bed', 'DMD_del2500_skip19_20', 'DMD_del2500_skip20_21', 'ClinVar']
      for (const t of visible_tracks) {
        state.session.view.showTrack(t);
      }

      const root = createRoot(
        document.getElementById('jbrowse_linear_genome_view'),
      )


      const view = React.createElement(JBrowseLinearGenomeView, {
          viewState: state,
        })
      root.render(view)
    </script>
  </body>
</html>
